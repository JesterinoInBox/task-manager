databaseChangeLog:

  - changeSet:
      id: create-outbox-table
      author: jesterino

      changes:

        - createTable:
            tableName: outbox_events

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)

              - column:
                  name: aggregate_id
                  type: BIGINT

              - column:
                  name: event_type
                  type: VARCHAR(100)

              - column:
                  name: payload
                  type: JSONB

              - column:
                  name: created_at
                  type: TIMESTAMP