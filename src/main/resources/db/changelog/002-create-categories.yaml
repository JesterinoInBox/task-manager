databaseChangeLog:
  - changeSet:
      id: 002-create-categories
      author: jesterino

      changes:
        - createTable:
            tableName: categories

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: category_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false