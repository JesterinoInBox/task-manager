databaseChangeLog:
  - changeSet:
      id: 003-create-tasks
      author: jesterino

      changes:
        - createTable:
            tableName: tasks

            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: category_id

            referencedTableName: categories
            referencedColumnNames: id

            constraintName: fk_tasks_category

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: user_id

            referencedTableName: users
            referencedColumnNames: id

            constraintName: fk_tasks_user